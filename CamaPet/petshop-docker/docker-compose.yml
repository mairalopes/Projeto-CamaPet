services:
  # Bancos de Dados
  db-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user_pet
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: petshop_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pet-network

  db-mongo:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db
    networks:
      - pet-network

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://db-mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    depends_on:
      - db-mongo
    networks:
      - pet-network

  # Aplicações Python
  api-clientes:
    build: ./api-clientes
    environment:
      DB_USER: user_pet
      DB_PASS: password123
      DB_NAME: petshop_db
    ports:
      - "5000:5000"
    depends_on:
      - db-postgres
    networks:
      - pet-network

  api-estoque:
    build: ./api-estoque
    ports:
      - "5001:5001"
    depends_on:
      - db-mongo
    networks:
      - pet-network

  api-servicos:
    build: ./api-servicos
    ports:
      - "5002:5002"
    depends_on:
      - api-clientes
      - api-estoque
    networks:
      - pet-network

networks:
  pet-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: